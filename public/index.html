<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barry, Forever</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f7f1e8">
  <script>
    // Runs before first paint: theme (avoid a flash) and the .js flag (reveal animations need JS).
    (function () {
      var t = null;
      try { t = localStorage.getItem('barry-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add('js');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/theme-overrides.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
</head>
<body>
  <nav class="nav" id="nav">
    <a class="brand" href="#top" aria-label="Barry"><span class="brand-icon" id="brand-icon"></span><span id="brand-name">Barry</span></a>
    <div class="nav-links">
      <a href="#story" data-i18n="nav.story"></a>
      <a href="#diary" id="nav-memories" data-i18n="nav.memories" hidden></a>
      <a href="#gallery" data-i18n="nav.photos"></a>
      <a href="#guest-photos" data-i18n="nav.messages"></a>
    </div>
    <div class="controls">
      <div class="langs" id="lang" role="group"></div>
      <button id="theme" type="button"></button>
    </div>
  </nav>

  <header class="hero" id="top">
    <div class="hero-bg" aria-hidden="true">
      <div class="orb a" data-parallax="0.35" data-pscroll></div>
      <div class="orb b" data-parallax="0.18" data-pscroll></div>
      <div class="petals"></div>
    </div>
    <div class="hero-inner">
      <p class="eyebrow" data-i18n="hero.memory"></p>
      <div class="portrait-wrap" data-parallax="0.1" data-pscroll>
        <div class="portrait" id="portrait"></div>
        <span class="paw-badge" id="badge" aria-hidden="true"></span>
      </div>
      <h1 class="hero-name" id="hero-name" data-parallax="-0.08" data-pscroll>Barry</h1>
      <p class="years" id="years"></p>
      <p class="breed" data-i18n="hero.breed"></p>
      <p class="dates" id="dates"></p>
      <p class="tagline" data-i18n="hero.tagline"></p>
      <p class="age" id="age"></p>
    </div>
    <a class="scroll-cue" href="#story"><span data-i18n="hero.scroll"></span></a>
  </header>

  <main>
    <section class="sec" id="story">
      <div class="wrap story-grid">
        <div class="story-side" data-reveal>
          <p class="sec-label" data-i18n="section.story"></p>
          <h3 data-i18n="section.loved"></h3>
          <ul class="chips" id="loved"></ul>
        </div>
        <div class="story-body" id="story-body" data-reveal></div>
      </div>
      <div class="wrap diary" id="diary" hidden>
        <p class="sec-label" data-i18n="section.diary" data-reveal></p>
        <div class="entries" id="entries"></div>
        <nav class="pagination" id="diary-pagination" hidden></nav>
      </div>
    </section>

    <section class="sec" id="life">
      <div class="wrap">
        <p class="sec-label" data-i18n="section.timeline" data-reveal></p>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="sec" id="gallery">
      <div class="wrap">
        <p class="sec-label" data-i18n="section.gallery" data-reveal></p>
        <div class="masonry" id="grid"></div>
        <p class="empty" id="gallery-empty" data-i18n="gallery.empty" hidden></p>
        <p class="ig-wrap" data-reveal>
          <a class="ig-link" href="https://www.instagram.com/mylovelybarry/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
            <span><span data-i18n="social.instagram"></span> <strong>@mylovelybarry</strong></span>
          </a>
        </p>
      </div>
    </section>

    <section class="sec" id="guest-photos">
      <div class="wrap">
        <p class="sec-label" data-i18n="section.messages" data-reveal></p>
        <div class="tributes-grid">
          <div>
            <ul class="comments" id="comments"></ul>
            <p class="empty" id="comments-empty" data-i18n="messages.empty" hidden></p>
            <nav class="pagination" id="pagination" hidden></nav>
          </div>
          <div class="tribute-aside" data-reveal>
            <p class="empty" id="guestbook-full" data-i18n="form.full" hidden></p>
            <form class="tribute" id="tribute-form">
              <input name="name" maxlength="40" required autocomplete="name" data-i18n-placeholder="form.name">
              <textarea name="message" maxlength="500" required data-i18n-placeholder="form.message"></textarea>
              <p class="count" id="message-count" aria-hidden="true"></p>
              <div class="photo-pick">
                <label class="filebtn">
                  <input type="file" id="photo-input" name="photo" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                  <span data-i18n="form.photo"></span>
                </label>
                <div class="preview" id="photo-preview" hidden>
                  <img alt="">
                  <button type="button" id="photo-remove" data-i18n="form.photoRemove"></button>
                </div>
              </div>
              <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
              <button type="submit" data-i18n="form.submit"></button>
              <p class="notice" id="form-note" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Closing page: the farewell quote and the memorial line, together, end the site -->
  <footer class="closing" data-parallax="0.12">
    <div class="petals" aria-hidden="true"></div>
    <div class="closing-quote">
      <div class="closing-photo" id="closing-photo" data-reveal hidden></div>
      <div id="interlude" hidden>
        <blockquote id="quote" data-reveal></blockquote>
      </div>
    </div>
    <a class="closing-ig" href="https://www.instagram.com/mylovelybarry/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @mylovelybarry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg><span>@mylovelybarry</span>
    </a>
    <p class="closing-line" data-i18n="footer"></p>
  </footer>

  <dialog class="memory" id="memory">
    <button class="mem-close" id="mem-close" type="button" aria-label="Close">×</button>
    <article id="memory-body"></article>
  </dialog>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <button class="lb-close" id="lb-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="lb-prev" id="lb-prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure style="margin:0"><div class="lb-video" id="lb-video" hidden></div><img alt=""><p id="lb-caption"></p></figure>
    <span class="lb-count" id="lb-count" aria-live="polite"></span>
    <button class="lb-next" id="lb-next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
